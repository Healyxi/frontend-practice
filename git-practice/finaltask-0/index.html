<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园自习室信息中心</title>
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园自习室信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#rooms">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">三维校园</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section id="home" class="py-5 home-block">
    <div class="container text-white">
      <h1 class="h2">校园自习室信息中心</h1>
      <p class="text-white-50">作业五的筛选+作业六的看板+作业七的三维，整合成一个入口。</p>

      <div class="row g-3 mt-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <p class="text-muted small mb-1">自习室总数</p>
              <p class="h3 mb-0" id="sum-total">—</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <p class="text-muted small mb-1">开放中</p>
              <p class="h3 mb-0" id="sum-open">—</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <p class="text-muted small mb-1">开放区剩余空座</p>
              <p class="h3 mb-0" id="sum-free">—</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

   <section id="rooms" class="py-5">
    <div class="container">
      <h2 class="h4 mb-3">自习室查询</h2>

      <div class="filters mb-2">
        <span class="small text-muted me-2">楼层</span>
        <button type="button" class="btn btn-sm btn-primary"         data-filter="all">全部</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-filter="1">1 层</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-filter="2">2 层</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-filter="3">3 层</button>
        <button type="button" class="btn btn-sm btn-outline-primary" data-filter="4">4 层</button>
      </div>

      <div class="mb-3">
        <label class="visually-hidden" for="keyword">搜索自习室</label>
        <input type="search" id="keyword" class="form-control form-control-sm"
               placeholder="按楼或名称搜索，例如：图书馆">
        <p class="small text-muted mt-1 mb-0" id="result-count"></p>
      </div>

      <div class="row g-3" id="room-list"></div>
    </div>
  </section>

  <footer class="py-4 border-top">
    <div class="container small text-muted">
      软件开发综合实践 个人整合练习 数据为课堂模拟数据
    </div>
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
