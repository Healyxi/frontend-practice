<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>星球宇宙  A-Frame 版</title>
  <script src="libs/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-sky color="#05070f"></a-sky>

    <a-light type="ambient" color="#ffffff" intensity="0.4"></a-light>
    <a-light type="point" position="0 0 0" color="#ffe066" intensity="1.2"></a-light>
    <a-camera position="0 24 52"></a-camera>

    <a-sphere position="0 0 0" radius="3" material="shader: flat; color: #ffcc33"></a-sphere>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 7000; loop: true; easing: linear">
      <a-sphere position="6.5 0 0" radius="0.45" color="#9e9e9e"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear">
      <a-sphere position="8.5 0 0" radius="0.68" color="#e8c98a"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 11000; loop: true; easing: linear">
      <a-sphere position="11 0 0" radius="0.7" color="#4fc3f7"></a-sphere>
      <a-entity position="11 0 0" animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear">
        <a-sphere position="2 0 0" radius="0.32" color="#cfd8dc"></a-sphere>
      </a-entity>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 14000; loop: true; easing: linear">
      <a-sphere position="13.5 0 0" radius="0.55" color="#c1440e"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 18000; loop: true; easing: linear">
      <a-sphere position="18 0 0" radius="1.6" color="#d9a066"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 22000; loop: true; easing: linear">
      <a-sphere position="21.5 0 0" radius="1.4" color="#d7c9a3"></a-sphere>
      <a-ring position="21.5 0 0" rotation="-90 0 0" radius-inner="2.1" radius-outer="3.4" color="#d7c9a3"></a-ring>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 28000; loop: true; easing: linear">
      <a-sphere position="25 0 0" radius="1.1" color="#8fd6d6"></a-sphere>
    </a-entity>

    <a-entity animation="property: rotation; to: 0 360 0; dur: 35000; loop: true; easing: linear">
      <a-sphere position="28 0 0" radius="1.05" color="#4a6fe0"></a-sphere>
    </a-entity>

    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="6.4" radius-outer="6.6" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="8.4" radius-outer="8.6" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="10.9" radius-outer="11.1" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="13.4" radius-outer="13.6" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="17.9" radius-outer="18.1" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="21.4" radius-outer="21.6" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="24.9" radius-outer="25.1" color="#3a4150"></a-ring>
    <a-ring position="0 0 0" rotation="-90 0 0" radius-inner="27.9" radius-outer="28.1" color="#3a4150"></a-ring>
  </a-scene>
</body>
</html>
