<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三维校园 校园自习室信息中心</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="libs/aframe.min.js"></script>
</head>
<body class="scene-page">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">校园自习室信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="../rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="../stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="scene.html">三维校园</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="campus-scene-wrap">
    <a-scene id="campusScene" embedded
             fog="type: linear; color: #dff4ff; near: 18; far: 50">
      <a-sky color="#dff4ff"></a-sky>

      <a-plane position="0 0 0" rotation="-90 0 0"
               width="64" height="64" color="#93bd8b"></a-plane>

      <a-plane position="-6.4 0.02 5.5" rotation="-90 0 0"
               width="2.4" height="12.5" color="#e9eef1"></a-plane>

      <a-plane position="-6.4 0.03 -0.6" rotation="-90 0 0"
               width="8" height="7" color="#dce5e7"></a-plane>

      <a-entity id="campusBuildings"></a-entity>

      <a-entity id="cameraRig" position="0 1.65 11">
        <a-camera id="mainCamera" fov="66"
                  look-controls="pointerLockEnabled: false"
                  wasd-controls="acceleration: 20">
          <a-entity cursor="rayOrigin: mouse"
                    raycaster="objects: .clickable; far: 100"></a-entity>
        </a-camera>
      </a-entity>

      <a-light type="hemisphere" color="#ffffff"
               ground-color="#77936f" intensity="0.95"></a-light>
      <a-light type="directional" position="-7 13 9" intensity="0.65"></a-light>
    </a-scene>

    <section class="scene-hud" aria-labelledby="sceneTitle">
      <p class="scene-kicker">3D CAMPUS GUIDE</p>
      <h1 id="sceneTitle">呈贡校区三维导览</h1>
      <p class="scene-help">
        按住鼠标拖动旋转视角，使用 W A S D 或方向键移动，点击楼栋查看详情。
      </p>

      <div class="scene-code-list" aria-label="楼栋缩写说明">
        <span><strong>LIB</strong> 图书馆</span>
        <span><strong>INFO</strong> 信息学院</span>
        <span><strong>NAN</strong> 楠苑宿舍</span>
      </div>

      <div class="scene-legend" aria-label="楼栋颜色说明">
        <span><i class="legend-dot low"></i>空闲</span>
        <span><i class="legend-dot middle"></i>较忙</span>
        <span><i class="legend-dot high"></i>拥挤</span>
        <span><i class="legend-dot neutral"></i>无数据</span>
      </div>

      <div class="scene-status" id="sceneStatus" aria-live="polite">
        正在读取自习室数据并生成楼栋。
      </div>

      <a class="scene-back-link" href="../rooms.html">返回自习室列表</a>
    </section>

    <aside id="infoPanel" class="scene-info-panel" aria-live="polite" hidden>
      <button type="button" id="closeInfo" class="scene-info-close" aria-label="关闭楼栋详情">
        ×
      </button>
      <p class="scene-info-code" id="infoCode"></p>
      <h2 id="infoTitle"></h2>
      <div id="infoBody"></div>
    </aside>

    <p class="scene-note">三维模型为校园空间示意图，非精确测绘。</p>
  </main>

  <script src="../libs/bootstrap.bundle.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="scene.js"></script>
</body>
</html>
